<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">SSAI dark logo</title>
  <desc id="desc">SSAI Supply Chain Risk Intelligence logo for dark backgrounds.</desc>
  <defs>
    <linearGradient id="wordDark" x1="160" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F6E7BD"/>
      <stop offset="1" stop-color="#D8E8F7"/>
    </linearGradient>
    <linearGradient id="flowDark" x1="154" y1="132" x2="580" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68BDF5"/>
      <stop offset="0.62" stop-color="#F2D488"/>
      <stop offset="1" stop-color="#FF6B4A"/>
    </linearGradient>
    <filter id="darkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(28 30)">
