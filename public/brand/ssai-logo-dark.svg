    <path d="M29 72 53 38 74 58 99 29 122 64 94 91 64 80 44 103" fill="none" stroke="#68BDF5" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 58 99 29 122 64 94 91" fill="none" stroke="#F2D488" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="29" cy="72" r="6.5" fill="#0F1A2B" stroke="#EAF6FF" stroke-width="3"/>
    <circle cx="53" cy="38" r="6.5" fill="#0F1A2B" stroke="#68BDF5" stroke-width="3"/>
    <circle cx="74" cy="58" r="7.5" fill="#0F1A2B" stroke="#EAF6FF" stroke-width="3"/>
    <circle cx="99" cy="29" r="6.5" fill="#0F1A2B" stroke="#68BDF5" stroke-width="3"/>
    <circle cx="122" cy="64" r="8" fill="#FF6B4A"/>
    <circle cx="122" cy="64" r="13" fill="none" stroke="#FF6B4A" stroke-opacity="0.28" stroke-width="2.5"/>
    <circle cx="94" cy="91" r="6.5" fill="#0F1A2B" stroke="#F2D488" stroke-width="3"/>
