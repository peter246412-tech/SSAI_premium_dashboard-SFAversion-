  <text x="176" y="94" fill="url(#wordDark)" font-family="Inter, Pretendard, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="8">SSAI</text>
  <text x="181" y="126" fill="#8FA1B8" font-family="Inter, Pretendard, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2">SUPPLY CHAIN RISK INTELLIGENCE</text>
  <path d="M181 143 H266 L284 133 H353 L371 143 H455 L470 135 H534 L552 143 H596" fill="none" stroke="url(#flowDark)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="266" cy="143" r="4.5" fill="#0F1A2B" stroke="#68BDF5" stroke-width="2"/>
