<svg xmlns="http://www.w3.org/2000/svg" width="520" height="128" viewBox="0 0 520 128" role="img" aria-labelledby="title desc">
  <title id="title">SSAI wordmark, dark background</title>
  <desc id="desc">SSAI wordmark with supply chain flow and risk detection point.</desc>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="330" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#F6E7BD"/>
      <stop offset="1" stop-color="#D8E8F7"/>
    </linearGradient>
    <linearGradient id="flow" x1="10" y1="100" x2="422" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68BDF5"/>
      <stop offset="0.68" stop-color="#F2D488"/>
      <stop offset="1" stop-color="#FF6B4A"/>
    </linearGradient>
  </defs>
  <text x="4" y="70" fill="url(#word)" font-family="Inter, Pretendard, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="8">SSAI</text>
  <path d="M10 96 H92 L112 86 H181 L199 96 H286 L303 88 H367 L386 96 H422" fill="none" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="92" cy="96" r="4.6" fill="#0F1A2B" stroke="#68BDF5" stroke-width="2"/>
  <circle cx="181" cy="86" r="4.6" fill="#0F1A2B" stroke="#F2D488" stroke-width="2"/>
  <circle cx="286" cy="96" r="4.6" fill="#0F1A2B" stroke="#68BDF5" stroke-width="2"/>
  <circle cx="422" cy="96" r="5.4" fill="#FF6B4A"/>
  <text x="9" y="120" fill="#8FA1B8" font-family="Inter, Pretendard, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.6">EARLY WARNING SUPPLY SIGNALS</text>
</svg>
